name: Daily Check-in2

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
    
    - name: Run check-in script
      run: python ./main.py
      env:
        TZ: 'Asia/Shanghai'
        IKUUU_COOKIE_1: ${{ secrets.IKUUU_COOKIE_1 }}
        IKUUU_COOKIE_2: ${{ secrets.IKUUU_COOKIE_2 }}
    
    - name: Save results
      run: |
        echo "$(date): 签到完成" >> checkin_history.txt
    
    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add checkin_history.txt
        git commit -m "Update checkin history" || exit 0
        git push
